<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rejestracja</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap');
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Raleway", sans-serif;
        }

        body {
            height: 100vh;
        }

        .container {
            height: 100%;
            display: grid;
            grid-template-rows: 25% auto 10%;
        }

        nav, footer {
            background: #202020;
        }

        .logo-box, .logo {
            width: 100%;
            height: 200px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .logo {
            height: 100%;
            object-fit: none;
            opacity: 70%;
        }

        .logo-login {
            position: absolute;
            top: 10%;
            right: 10%;
            transition: all 0.3s;
        }

        .navigation {
            display: flex;
            justify-content: center;
            width: 80%;
            margin: 0 auto;
        }

        .navigation button {
            width: 100%;
            height: 80px;
        }

        .active, .inactive {
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            transition: background-color 0.3s, color 0.3s;
        }

        .active {
            background-color: #F0F0F0;
            color: #313131;
        }

        .active:hover {
            background-color: #ddd;
        }

        .inactive {
            background-color: #252525;
            color: #F0F0F0;
        }

        .inactive:hover {
            background-color: #383838;
        }

        .formbox {
            display: flex;
            flex-direction: column;
            width: 350px;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .flex-center {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .hidden {
            display: none;
        }

        .form-image {
            width: 150px;
            height: 150px;
            object-fit: scale-down;
            margin-bottom: 20px;
            border-radius: 50%;
            border: 1px solid #ccc;
            background-image: radial-gradient(circle, blue, cyan);
        }

        footer {
            display: flex;
            justify-content: end;
            color: #F0F0F0;
            padding: 10px;
            align-items: center;
        }

        input {
            width: 100%;
            padding: 10px;
        }

        .button-box {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 10px;
            justify-content: space-between;
            width: 100%;
        }

        .content {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #F0F0F0;
        }

        .login-button, .register-button {
            width: 120px;
            height: 35px;
            border: none;
            background-color: #202020;
            color: #F0F0F0;
            cursor: pointer;
            transition: background-color 0.3s, color 0.3s;
        }

        .login-button:hover, .register-button:hover {
            background-color: #313131;
        }

        .password-forgot {
            color: #414141;
        }

        .password-forgot:hover {
            color: #111111
        }

    </style>
</head>
<body>
    <div class="container">
        <nav>
            <div>
                <div class="logo-box">
                    <img class="logo" src="gfx/logo.png" alt="Logo">
                    <script src="https://kit.fontawesome.com/fadd1db071.js" crossorigin="anonymous"></script>
                    <button class="logo-login" onclick="loginPage()"><i class="fa-solid fa-gears"></i> Zaloguj się</button>
                </div>
                <div class="navigation">
                    <button id="login-page-button" onclick="loginPage()">Zaloguj</button>
                    <button id="register-page-button" onclick="registerPage()">Utwórz konto</button>
                </div>    
            </div>
            <p id="returnMessage"></p>
        </nav>
        <div class="content">
            <div class="flex-center">
                <form method="POST" class="hidden" id="registerbox" action="register.php">
                    <img src="gfx/register.webp" alt="Rejestracja" class="form-image">
                    <input type="email" name="email" placeholder="Email" required autocomplete="off">
                    <input type="password" name="password" placeholder="Hasło" required autocomplete="off">
                    <button class="register-button" type="submit" onclick="registerUser()">Zarejestruj mnie</button>
                </form>
            </div>
            <div class="flex-center">
                <form method="POST" class="formbox" id="loginbox">
                    <img src="gfx/login.webp" alt="Logowanie" class="form-image">
                    <input type="email" name="email" placeholder="Email" required autocomplete="off">
                    <input type="password" name="password" placeholder="Hasło" required autocomplete="off">
                    <div class="button-box">
                        <button class="login-button" type="submit" onclick="loginUser()">Zaloguj</button>
                        <a href="#" class="password-forgot">Zapomniałem hasła</a>
                    </div>
                </form>
            </div>    
        </div>
        <footer>
            <p>Copyright &#169; 2025 by Filip L</p>
        </footer>
    </div>

    <script>
        const loginPage = () => {
            console.log("loginPage changed");
            document.getElementById('loginbox').className = 'formbox';
            document.getElementById('registerbox').className = 'hidden'; 
            document.getElementById('login-page-button').className = 'active';
            document.getElementById('register-page-button').className = 'inactive';
        };

        const registerPage = () => {
            console.log("registerPage changed");
            document.getElementById('registerbox').className = 'formbox';
            document.getElementById('loginbox').className = 'hidden';
            document.getElementById('register-page-button').className = 'active';
            document.getElementById('login-page-button').className = 'inactive';
        };

        loginPage();
    </script>
</body>
</html>
